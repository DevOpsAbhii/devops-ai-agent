# Release pipeline: test gate → PyPI + GHCR on a v* tag.
#
# One-time setup (maintainer):
# - PyPI: register a Trusted Publisher on pypi.org for the `devopsiq` project
#   (owner DevOpsAbhii, repo devops-ai-agent, workflow release.yml,
#   environment pypi). No token lives in this repo. Token fallback: add a
#   PYPI_TOKEN secret and replace the publish step's environment/permissions
#   with `password: ${{ secrets.PYPI_TOKEN }}`.
# - GHCR: nothing to set up — GITHUB_TOKEN works.
#
# Cut a release:  git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Offline test suite
        run: python -m unittest discover -s tests

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read        # job-level permissions replace, not merge —
      # keep read access for checkout. Trusted Publishing: the OIDC token
      # proves this workflow to PyPI.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read        # job-level permissions replace, not merge —
      packages: write       # keep read access for checkout
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=devops-ai-agent
            org.opencontainers.image.description=Read-only AI agent that investigates DevOps problems (58 tools).
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitHub Release page with auto-generated notes (from commits + the
  # changelog section for this version, when present).
  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
